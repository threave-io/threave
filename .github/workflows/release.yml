name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "Release tags must look like v0.1.0; got $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        env:
          VITE_THREAVE_VERSION: ${{ steps.version.outputs.version }}
        run: bun run build

      - name: Stage embedded frontend assets
        run: bun run build:stage

      - name: Verify embedded assets are committed
        shell: bash
        run: |
          status="$(git status --porcelain --untracked-files=all -- internal/webassets/dist)"
          if [[ -z "$status" ]]; then
            echo "Embedded frontend assets are current"
            exit 0
          fi

          echo "::error::Embedded frontend assets are out of date for this tag."
          echo "Use the Prepare Release workflow so generated assets are committed before the tag is created."
          echo
          echo "Changed files:"
          printf '%s\n' "$status"
          echo
          git diff --stat -- internal/webassets/dist
          exit 1

      - name: Test backend
        run: go test ./...

      - name: Build release archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bun run release:archives

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.version.outputs.tag }}" \
              dist/*.tar.gz \
              dist/*.zip \
              dist/SHA256SUMS \
              --clobber
          else
            gh release create "${{ steps.version.outputs.tag }}" \
              dist/*.tar.gz \
              dist/*.zip \
              dist/SHA256SUMS \
              --verify-tag \
              --title "Threave ${{ steps.version.outputs.tag }}" \
              --generate-notes
          fi

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::HOMEBREW_TAP_TOKEN is required to dispatch the tap update."
            exit 1
          fi
          gh workflow run update-threave.yml --repo threave-io/homebrew-tap --ref main
